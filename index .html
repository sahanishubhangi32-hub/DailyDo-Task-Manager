<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyDo | Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f3ed;
            color: #493b32;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 36px;
            color: #795c48;
            margin-bottom: 10px;
        }

        header p {
            color: #8b7a6b;
            font-size: 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px #0000000a;
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #e2d7cb;
            border-radius: 8px;
            background: #fffdfb;
            color: #493b32;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #795c48;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #5e4434;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            background: #eee4d8;
            padding: 16px 8px;
            border-radius: 12px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .stat span {
            font-size: 12px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filters button {
            padding: 9px 13px;
            background: #eee4d8;
            color: #493b32;
        }

        .filters button.active {
            background: #795c48;
            color: white;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 0;
            border-bottom: 1px solid #eee7df;
        }

        .task:last-child {
            border-bottom: none;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-info h3 {
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .task-info p {
            color: #8b7a6b;
            font-size: 12px;
            margin-top: 6px;
        }

        .task.done h3 {
            text-decoration: line-through;
            color: #a49a91;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .task-actions button {
            padding: 8px;
            font-size: 12px;
        }

        .delete {
            background: #a75c50;
        }

        .empty {
            text-align: center;
            padding: 25px 5px;
            color: #9a8b7e;
        }

        .progress-bg {
            background: #eee4d8;
            height: 9px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            background: #8aab85;
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }

        footer {
            text-align: center;
            color: #9a8b7e;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 30px;
            }

            .card {
                padding: 16px;
            }

            .task {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>DailyDo ✦</h1>
        <p>Plan your day. Focus on what matters.</p>
        <p id="today" style="margin-top:10px;"></p>
    </header>

    <div class="stats">
        <div class="stat">
            <strong id="total">0</strong>
            <span>Total Tasks</span>
        </div>

        <div class="stat">
            <strong id="pending">0</strong>
            <span>Pending</span>
        </div>

        <div class="stat">
            <strong id="completed">0</strong>
            <span>Completed</span>
        </div>
    </div>

    <section class="card">
        <h2 id="formTitle">＋ Add a New Task</h2>

        <form id="taskForm">
            <input type="text" id="taskTitle"
                   placeholder="What do you need to do?"
                   required maxlength="150">

            <input type="date" id="taskDate">

            <select id="taskPriority">
                <option value="Normal">Normal Priority</option>
                <option value="High">High Priority</option>
                <option value="Low">Low Priority</option>
            </select>

            <button type="submit" id="saveButton">
                Add Task
            </button>

            <button type="button" id="cancelButton"
                    style="display:none;background:#a49a91;">
                Cancel
            </button>
        </form>
    </section>

    <section class="card">
        <h2>My Tasks</h2>

        <div class="filters">
            <button class="active" data-filter="all">All</button>
            <button data-filter="pending">Pending</button>
            <button data-filter="completed">Completed</button>
        </div>

        <div id="taskList">
            <div class="empty">No tasks yet. Add your first task!</div>
        </div>

        <p id="progressText" style="margin-top:18px;font-size:13px;">
            0% completed
        </p>

        <div class="progress-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <footer>
        DailyDo — Your day, organised with care.
    </footer>

</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("dailyDoTasks")) || [];
    let currentFilter = "all";
    let editingId = null;

    document.getElementById("today").textContent =
        new Date().toLocaleDateString("en-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    const form = document.getElementById("taskForm");
    const titleInput = document.getElementById("taskTitle");
    const dateInput = document.getElementById("taskDate");
    const priorityInput = document.getElementById("taskPriority");

    function saveTasks() {
        localStorage.setItem("dailyDoTasks", JSON.stringify(tasks));
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = titleInput.value.trim();

        if (!title) {
            alert("Please enter a task name.");
            return;
        }

        if (editingId !== null) {
            const task = tasks.find(t => t.id === editingId);

            if (task) {
                task.title = title;
                task.date = dateInput.value;
                task.priority = priorityInput.value;
            }

            editingId = null;
            document.getElementById("formTitle").textContent =
                "＋ Add a New Task";
            document.getElementById("saveButton").textContent = "Add Task";
            document.getElementById("cancelButton").style.display = "none";

        } else {
            tasks.unshift({
                id: Date.now(),
                title: title,
                date: dateInput.value,
                priority: priorityInput.value,
                completed: false
            });
        }

        saveTasks();
        form.reset();
        renderTasks();
    });

    function editTask(id) {
        const task = tasks.find(t => t.id === id);

        if (!task) return;

        editingId = id;
        titleInput.value = task.title;
        dateInput.value = task.date;
        priorityInput.value = task.priority;

        document.getElementById("formTitle").textContent = "Edit Task";
        document.getElementById("saveButton").textContent = "Save Changes";
        document.getElementById("cancelButton").style.display = "inline-block";

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("cancelButton").addEventListener("click", function() {
        editingId = null;
        form.reset();

        document.getElementById("formTitle").textContent =
            "＋ Add a New Task";
        document.getElementById("saveButton").textContent = "Add Task";
        this.style.display = "none";
    });

    function toggleTask(id) {
        const task = tasks.find(t => t.id === id);

        if (task) {
            task.completed = !task.completed;
            saveTasks();
            renderTasks();
        }
    }

    function deleteTask(id) {
        if (confirm("Are you sure you want to delete this task?")) {
            tasks = tasks.filter(t => t.id !== id);

            if (editingId === id) {
                editingId = null;
                form.reset();
                document.getElementById("formTitle").textContent =
                    "＋ Add a New Task";
                document.getElementById("saveButton").textContent = "Add Task";
                document.getElementById("cancelButton").style.display = "none";
            }

            saveTasks();
            renderTasks();
        }
    }

    document.querySelectorAll(".filters button").forEach(button => {
        button.addEventListener("click", function() {
            currentFilter = this.dataset.filter;

            document.querySelectorAll(".filters button").forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");
            renderTasks();
        });
    });

    function renderTasks() {
        const list = document.getElementById("taskList");

        const visibleTasks = tasks.filter(task => {
            if (currentFilter === "pending") return !task.completed;
            if (currentFilter === "completed") return task.completed;
            return true;
        });

        if (visibleTasks.length === 0) {
            list.innerHTML =
                '<div class="empty">No tasks found in this category.</div>';
        } else {
            list.innerHTML = visibleTasks.map(task => `
                <div class="task ${task.completed ? "done" : ""}">
                    <input type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${task.id})"
                        aria-label="Mark task complete"
                        style="width:18px;height:18px;margin:0;">

                    <div class="task-info">
                        <h3>${escapeHTML(task.title)}</h3>
                        <p>
                            ${task.date ? "Due: " + escapeHTML(task.date) + " · " : ""}
                            ${escapeHTML(task.priority)} Priority
                        </p>
                    </div>

                    <div class="task-actions">
                        <button onclick="editTask(${task.id})">Edit</button>
                        <button class="delete"
                            onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const pending = total - completed;
        const percent = total ? Math.round(completed / total * 100) : 0;

        document.getElementById("total").textContent = total;
        document.getElementById("pending").textContent = pending;
        document.getElementById("completed").textContent = completed;
        document.getElementById("progressText").textContent =
            percent + "% completed";
        document.getElementById("progressFill").style.width = percent + "%";
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }

    renderTasks();
</script>

</body>
</html>
